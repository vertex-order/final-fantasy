# sync.toml — cross-repo file sync. Read by scripts/sync.py (`just sync`).
# See AGENTS.md → "Cross-repo sync" and CONTRIBUTING.md.
#
# [subscribe.*] — what THIS repo vendors FROM elsewhere. sync.py fetches these
#                 at `ref` and writes them into the tree. Vendored copies —
#                 never hand-edit; edit them in the owning repo (kit).
#                 check-vendored.yml fails the PR if any has drifted.
#
# This repo publishes nothing — it owns no file another repo vendors. Every
# platform icon reference in site/data/series-*.js was migrated to the
# canonical platforms names/sizes/model in the same pass that added
# PlatformIcon.dc.html, platform-icons.js, and images/platforms/
# ([subscribe.platforms] below — pulled directly, not via kit, to avoid an
# extra repin/PR hop whenever platforms changes).
#
# Not vendored, even though this repo needs its own: .github/ISSUE_TEMPLATE/*
# and .github/PULL_REQUEST_TEMPLATE.md. Each necessarily carries this repo's
# own Discussions URL (and PR-checklist lines), so a byte-identical vendor is
# impossible by construction. Seeded from kit's copies once, then maintained
# locally. site/Intro.dc.html is the same story: seeded once from kit's
# template copy, then hand-edited with this franchise's own "Where to
# start?" prose — see docs/init-list.md (kit).

[subscribe.kit]
repo = "vertex-order/kit"
ref = "50e0158e7bc0e9f8712c39f886b7584d1e0506a4"
paths = [
  "sync.list.toml",
  "docs/subtitle.md",
  "docs/cache.md",
  "site/_ds/",
  "site/images/ui/",
  "site/support.js",
  "site/theme-dev.js",
  "site/data/common-faq.js",
  "site/data/catalogs.js",
  "site/BackToTop.dc.html",
  "site/HelpWanted.dc.html",
  "site/DescRun.dc.html",
  "site/EntryByline.dc.html",
  "site/EntryTitleLinks.dc.html",
  "site/ExtrasToggle.dc.html",
  "site/FAQ.dc.html",
  "site/FloatingCorner.dc.html",
  "site/FloatingNav.dc.html",
  "site/Footer.dc.html",
  "site/InPageControls.dc.html",
  "site/LanguageTag.dc.html",
  "site/LengthDisplay.dc.html",
  "site/MediaEntry.dc.html",
  "site/Metadata.dc.html",
  "site/page.dc.html",
  "site/RatingDisplay.dc.html",
  "site/SeriesSection.dc.html",
  "site/StatusBadge.dc.html",
  "scripts/bundle-components.py",
  "scripts/ssr-render.js",
  "scripts/ssr-lib.js",
  "scripts/sync.py",
  "scripts/check-dedup-drift.py",
  "scripts/normalize-svg.py",
  "scripts/restore-headers.py",
  "scripts/ensure-helmets.py",
  "scripts/strip-c2pa.py",
  "scripts/trim-svg.py",
  "svgo.config.mjs",
  ".stylelintrc.cjs",
  "justfile",
  "package.json",
  "package-lock.json",
  ".npmrc",
  ".node-version",
  ".gitignore",
  ".editorconfig",
  ".gitattributes",
  ".vscode/extensions.json",
  ".claude/settings.json",
  "CODE_OF_CONDUCT.md",
  ".githooks/pre-commit",
  ".github/workflows/fix-build.yml",
  ".github/workflows/autofix.yml",
  ".github/workflows/autofix-apply.yml",
  ".github/workflows/check-generated.yml",
  ".github/workflows/check-vendored.yml",
  ".github/workflows/check-dedup-drift.yml",
  ".github/workflows/check-css.yml",
  ".github/workflows/check-syntax.yml",
  ".github/workflows/sync-repin.yml",
  ".github/workflows/static.yml",
  ".github/dependabot.yml",
