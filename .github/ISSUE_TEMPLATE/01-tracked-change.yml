name: Tracked change
description: Collaborator-only technical tracking for a change already agreed in Discussions.
labels: ["tracked"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are **only** for technical coordination between
        collaborators on a change that has already been raised and agreed in
        [Discussions](https://github.com/vertex-order/final-fantasy/discussions).

        If you're proposing or debating a change — a game entry, a series,
        a platform icon, a question — start a Discussion instead. That's
        where the conversation happens; the issue is just the work item.
  - type: input
    id: discussion
    attributes:
      label: Discussion link
      description: The Discussions thread where this change was raised and agreed.
      placeholder: https://github.com/vertex-order/final-fantasy/discussions/000
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What needs doing
      description: >-
        The concrete technical work — files, entries, series, icons. Keep
        design debate in the Discussion and link back to it for context.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Blockers, related PRs or issues, follow-ups.
    validations:
      required: false
